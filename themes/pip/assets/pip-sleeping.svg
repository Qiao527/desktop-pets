<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs><style>
  .breathe { transform-origin: 8px 14px; animation: breathe 3.2s infinite ease-in-out; }
  .blink { transform-origin: 8px 9px; animation: blink 4s infinite ease-in-out; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,0.97); } }
  @keyframes blink { 0%,8%,100% { transform: scaleY(1); } 4% { transform: scaleY(0.1); } }
.flat { transform-origin: 8px 15px; transform: scale(1.1,0.8); }
  .slowbreathe { transform-origin: 8px 15px; animation: sb 4s infinite ease-in-out; }
  @keyframes sb { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,0.96); } }
  .z { animation: zfloat 4s infinite linear; opacity: 0; }
  .z2 { animation-delay: 1.3s; } .z3 { animation-delay: 2.6s; }
  @keyframes zfloat { 0% { opacity: 0; transform: translate(0,0); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(4px,-8px); } }</style></defs>
  <g id="shadow-js"><rect x="3" y="15" width="10" height="1" fill="#000000" opacity="0.35"/></g><g class="flat"><g class="slowbreathe"><g id="feet" fill="#3D8F81"><rect x="4" y="14" width="2" height="1" fill="#3D8F81"/><rect x="10" y="14" width="2" height="1" fill="#3D8F81"/></g><rect x="5" y="5" width="6" height="1" fill="#4FB3A2"/><rect x="4" y="6" width="8" height="1" fill="#4FB3A2"/><rect x="3" y="7" width="10" height="6" fill="#4FB3A2"/><rect x="4" y="13" width="8" height="1" fill="#3D8F81"/><rect x="4" y="7" width="1" height="2" fill="#86D3C6"/><rect x="5" y="6" width="1" height="1" fill="#86D3C6"/><rect x="4" y="10" width="1" height="1" fill="#F09A9A"/><rect x="11" y="10" width="1" height="1" fill="#F09A9A"/><rect x="7" y="3" width="1" height="2" fill="#67B84F"/><rect x="8" y="3" width="1" height="1" fill="#67B84F"/><rect x="9" y="2" width="1" height="1" fill="#67B84F"/><rect x="5" y="9" width="2" height="1" fill="#1E2B2A"/><rect x="9" y="9" width="2" height="1" fill="#1E2B2A"/></g></g><g class="z"><rect x="12" y="3" width="3" height="1" fill="#2E3440"/><rect x="13" y="4" width="1" height="1" fill="#2E3440"/><rect x="12" y="5" width="3" height="1" fill="#2E3440"/></g><g class="z z2"><rect x="12" y="3" width="3" height="1" fill="#2E3440"/><rect x="13" y="4" width="1" height="1" fill="#2E3440"/><rect x="12" y="5" width="3" height="1" fill="#2E3440"/></g><g class="z z3"><rect x="12" y="3" width="3" height="1" fill="#2E3440"/><rect x="13" y="4" width="1" height="1" fill="#2E3440"/><rect x="12" y="5" width="3" height="1" fill="#2E3440"/></g>
</svg>
