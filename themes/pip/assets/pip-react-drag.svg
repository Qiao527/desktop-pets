<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" shape-rendering="crispEdges">
  <defs><style>
  .breathe { transform-origin: 8px 14px; animation: breathe 3.2s infinite ease-in-out; }
  .blink { transform-origin: 8px 9px; animation: blink 4s infinite ease-in-out; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,0.97); } }
  @keyframes blink { 0%,8%,100% { transform: scaleY(1); } 4% { transform: scaleY(0.1); } }
.dangle { transform-origin: 8px 2px; animation: dangle 1s infinite ease-in-out; }
  @keyframes dangle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }</style></defs>
  <g class="dangle"><rect x="3" y="15" width="2" height="1" fill="#3D8F81"/><rect x="11" y="15" width="2" height="1" fill="#3D8F81"/><g><rect x="5" y="5" width="6" height="1" fill="#4FB3A2"/><rect x="4" y="6" width="8" height="1" fill="#4FB3A2"/><rect x="3" y="7" width="10" height="6" fill="#4FB3A2"/><rect x="4" y="13" width="8" height="1" fill="#3D8F81"/><rect x="4" y="7" width="1" height="2" fill="#86D3C6"/><rect x="5" y="6" width="1" height="1" fill="#86D3C6"/><rect x="4" y="10" width="1" height="1" fill="#F09A9A"/><rect x="11" y="10" width="1" height="1" fill="#F09A9A"/><rect x="7" y="3" width="1" height="2" fill="#67B84F"/><rect x="8" y="3" width="1" height="1" fill="#67B84F"/><rect x="9" y="2" width="1" height="1" fill="#67B84F"/><rect x="5" y="8" width="2" height="2" fill="#1E2B2A"/><rect x="9" y="8" width="2" height="2" fill="#1E2B2A"/><rect x="7" y="11" width="2" height="1" fill="#1E2B2A"/></g></g>
</svg>
